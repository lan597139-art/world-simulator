app = 'backend-lingering-moonbeam-4274'
primary_region = 'nrt'

[build]

# 在这里强制指定线上数据库的路径
[env]
  DB_PATH = "/data/worlds.db"
  WS_UPLOAD_DIR = "/data/uploads"
  WS_REGISTRATION_ENABLED = "1"
  WS_INVITE_REQUIRED = "1"
  WS_CORS_ORIGINS = "https://world-simulator-elht.vercel.app"
  WS_CORS_ORIGIN_REGEX = "https://world-simulator-.*\\.vercel\\.app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# 挂载持久卷
[mounts]
  source = "world_sim_data"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  