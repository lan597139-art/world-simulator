databases:
  - name: world-simulator-db
    databaseName: world_simulator
    plan: free
    region: oregon

services:
  - type: web
    name: world-simulator-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: world-simulator-db
          property: connectionString
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-ai/DeepSeek-V4.1-Flash
      - key: AI_SERVER_KEY_ENABLED
        value: "false"
      - key: WS_REGISTRATION_ENABLED
        value: "1"
      - key: WS_INVITE_REQUIRED
        value: "1"
      - key: WS_EMAIL_MODE
        value: "off"
      - key: WS_SETUP_TOKEN
        sync: false
      - key: WS_STORAGE_BACKEND
        value: local
      - key: WS_UPLOAD_DIR
        value: /data/uploads
      - key: WS_CORS_ORIGINS
        value: https://world-simulator-elht.vercel.app
      - key: WS_CORS_ORIGIN_REGEX
        value: https://world-simulator-.*\.vercel\.app
    disk:
      name: world-simulator-uploads
      mountPath: /data
      sizeGB: 1
