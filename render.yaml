services:
  - type: web
    name: world-simulator-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/world_simulator.db
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-ai/DeepSeek-V4.1-Flash
      - key: AI_SERVER_KEY_ENABLED
        value: "false"
    disk:
      name: world-simulator-data
      mountPath: /data
      sizeGB: 1
